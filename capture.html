<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cámara</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 620px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
      background: #f5f5f5;
      color: #222;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    video, canvas {
      width: 100%;
      max-width: 520px;
      border-radius: 14px;
      background: #111;
      margin-top: 16px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #start { background: #222; color: white; }
    #take { background: #0a7; color: white; display: none; }
    #again { display: none; }
    #status { min-height: 24px; margin-top: 14px; }
    .small { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tomar una foto</h1>
    <p>
      Para continuar, debes permitir el acceso a la cámara cuando tu navegador
      lo solicite. La foto solo se toma cuando pulsas «Tomar foto».
    </p>

    <button id="start">Activar cámara</button>
    <button id="take">Tomar foto</button>
    <button id="again">Repetir</button>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>

    <p id="status"></p>
    <p class="small">
      Puedes bloquear el acceso a la cámara desde los permisos de tu navegador.
    </p>
  </div>

<script>
const token = location.pathname.split("/").pop();
const start = document.getElementById("start");
const take = document.getElementById("take");
const again = document.getElementById("again");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

let stream = null;

function setStatus(text) {
  status.textContent = text;
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;
    start.style.display = "none";
    take.style.display = "inline-block";
    setStatus("Cámara activada. Cuando estés listo, pulsa «Tomar foto».");
  } catch (err) {
    console.error(err);
    setStatus(
      "No se pudo acceder a la cámara. Comprueba que has concedido el permiso."
    );
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

async function takePhoto() {
  if (!stream) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  setStatus("Enviando foto...");

  canvas.toBlob(async blob => {
    try {
      const form = new FormData();
      form.append("photo", blob, "photo.jpg");

      const response = await fetch(`/api/photo/${token}`, {
        method: "POST",
        body: form
      });

      const result = await response.json();

      if (!result.ok) {
        throw new Error(result.error || "Error desconocido");
      }

      stopCamera();
      video.style.display = "none";
      take.style.display = "none";
      again.style.display = "none";
      setStatus("Foto enviada correctamente.");
    } catch (err) {
      console.error(err);
      setStatus("No se pudo enviar la foto. Puedes intentarlo de nuevo.");
      again.style.display = "inline-block";
    }
  }, "image/jpeg", 0.9);
}

start.addEventListener("click", startCamera);
take.addEventListener("click", takePhoto);

again.addEventListener("click", () => {
  location.reload();
});

window.addEventListener("pagehide", stopCamera);
</script>
</body>
</html>
